<div id="falsePositiveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Mark as false positive</h3>
            <button class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to mark this correction as a false positive?</p>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="isPattern" name="isPattern">
                <label for="isPattern">Match as pattern (use regular expression)</label>
            </div>
        </div>
        <div class="modal-footer">
            <button id="confirmFalsePositiveBtn" class="btn-primary">Confirm</button>
            <button id="cancelFalsePositiveBtn" class="btn-secondary">Cancel</button>
        </div>
    </div>
</div>
