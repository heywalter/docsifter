services:
  docsifter-ai:
    build:
      context: .
      args:
        INSTALL_MODEL_RUNTIME: ${DOCSIFTER_INSTALL_MODEL_RUNTIME:-false}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DOCSIFTER_DATA_DIR: /app/data
      DOCSIFTER_PUBLIC_URL: ${DOCSIFTER_PUBLIC_URL:-}
      DOCSIFTER_ADMIN_TOKEN: ${DOCSIFTER_ADMIN_TOKEN:-}
      DOCSIFTER_GITHUB_TOKEN: ${DOCSIFTER_GITHUB_TOKEN:-}
      DOCSIFTER_EMAIL_SMTP_SERVER: ${DOCSIFTER_EMAIL_SMTP_SERVER:-}
      DOCSIFTER_EMAIL_SMTP_PORT: ${DOCSIFTER_EMAIL_SMTP_PORT:-587}
      DOCSIFTER_EMAIL_USERNAME: ${DOCSIFTER_EMAIL_USERNAME:-}
      DOCSIFTER_EMAIL_PASSWORD: ${DOCSIFTER_EMAIL_PASSWORD:-}
      DOCSIFTER_EMAIL_SENDER: ${DOCSIFTER_EMAIL_SENDER:-}
      DOCSIFTER_EMAIL_RECIPIENTS: ${DOCSIFTER_EMAIL_RECIPIENTS:-}
      DOCSIFTER_EMAIL_NOTIFICATIONS_ENABLED: ${DOCSIFTER_EMAIL_NOTIFICATIONS_ENABLED:-false}
      HF_HOME: /app/data/model-cache/huggingface
    volumes:
      - ./examples:/app/examples:ro
      - docsifter-data:/app/data

volumes:
  docsifter-data:
